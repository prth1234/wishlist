<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Filter by budget. Save what matters.">
  <defs>
    <linearGradient id="wl-ft-bar" x1="0" x2="1">
      <stop class="g1" offset="0"/>
      <stop class="g2" offset="0.5"/>
      <stop class="g3" offset="1"/>
    </linearGradient>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .teal { fill: #2DD4BF; }
  .g1 { stop-color: #6366F1; }
  .g2 { stop-color: #A855F7; }
  .g3 { stop-color: #00CDAC; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .teal { fill: #0D9488; }
  }

  .trace { stroke-dasharray: 8 7; animation: wl-ft-tr 2.5s linear infinite; }
  @keyframes wl-ft-tr { to { stroke-dashoffset: -30; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <path id="wl-ft-path" d="M 250 18 L 650 18" fill="none" stroke="url(#wl-ft-bar)" class="trace" stroke-width="2.2" stroke-linecap="round"/>
  <circle r="4" class="teal">
    <animateMotion dur="3.6s" repeatCount="indefinite">
      <mpath href="#wl-ft-path"/>
    </animateMotion>
  </circle>
  <text x="450" y="70" text-anchor="middle" font-size="36" font-weight="700" letter-spacing="-1" class="fg">Filter by budget. Save what matters.</text>
  <text x="450" y="98" text-anchor="middle" font-size="14" class="mut">React, Vite, PrimeReact &amp; localStorage persistence.</text>
</svg>
