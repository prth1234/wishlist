<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 112" width="900" height="112" role="img" aria-label="Filter by budget. Save what matters.">
  <defs>
    <linearGradient id="wl-ft-bar" x1="0" x2="1">
      <stop class="g1" offset="0"/>
      <stop class="g2" offset="0.5"/>
      <stop class="g3" offset="1"/>
    </linearGradient>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #F8FAFC; stroke-opacity: 0.22; stroke-width: 1.3; }
  .ind { fill: #818CF8; }
  .ind-s { stroke: #818CF8; }
  .purp { fill: #C084FC; }
  .purp-s { stroke: #C084FC; }
  .cobalt { fill: #60A5FA; }
  .cobalt-s { stroke: #60A5FA; }
  .teal { fill: #2DD4BF; }
  .teal-s { stroke: #2DD4BF; }
  .g1 { stop-color: #6366F1; }
  .g2 { stop-color: #A855F7; }
  .g3 { stop-color: #00CDAC; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .bd { stroke: #000000; stroke-opacity: 0.2; }
    .ind { fill: #4F46E5; }
    .ind-s { stroke: #4F46E5; }
    .purp { fill: #9333EA; }
    .purp-s { stroke: #9333EA; }
    .cobalt { fill: #0043ED; }
    .cobalt-s { stroke: #0043ED; }
    .teal { fill: #0D9488; }
    .teal-s { stroke: #0D9488; }
  }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <rect x="250" y="16" width="400" height="2" rx="1" fill="url(#wl-ft-bar)"/>
  <text x="450" y="68" text-anchor="middle" font-size="36" font-weight="700" letter-spacing="-1" class="fg">Filter by budget. Save what matters.</text>
  <text x="450" y="96" text-anchor="middle" font-size="14" class="mut">React, Vite, PrimeReact &amp; localStorage persistence.</text>
</svg>
