<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" width="900" height="182" role="img" aria-label="Wishlist features">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #F8FAFC; stroke-opacity: 0.22; stroke-width: 1.3; }
  .ind { fill: #818CF8; }
  .ind-s { stroke: #818CF8; }
  .purp { fill: #C084FC; }
  .purp-s { stroke: #C084FC; }
  .cobalt { fill: #60A5FA; }
  .cobalt-s { stroke: #60A5FA; }
  .teal { fill: #2DD4BF; }
  .teal-s { stroke: #2DD4BF; }
  .g1 { stop-color: #6366F1; }
  .g2 { stop-color: #A855F7; }
  .g3 { stop-color: #00CDAC; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .bd { stroke: #000000; stroke-opacity: 0.2; }
    .ind { fill: #4F46E5; }
    .ind-s { stroke: #4F46E5; }
    .purp { fill: #9333EA; }
    .purp-s { stroke: #9333EA; }
    .cobalt { fill: #0043ED; }
    .cobalt-s { stroke: #0043ED; }
    .teal { fill: #0D9488; }
    .teal-s { stroke: #0D9488; }
  }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <rect x="2" y="14" width="206" height="152" rx="10" class="bd"/>
  <text x="22" y="48" font-size="13" font-weight="600" class="cobalt">FILTERING</text>
  <text x="22" y="84" font-size="18" font-weight="600" class="fg">Sidebar &amp; Tags</text>
  <text x="22" y="114" font-size="13" class="mut">Filter by category and</text>
  <text x="22" y="134" font-size="13" class="mut">price range in real time.</text>

  <rect x="232" y="14" width="206" height="152" rx="10" class="bd"/>
  <text x="252" y="48" font-size="13" font-weight="600" class="ind">BUDGET</text>
  <text x="252" y="84" font-size="18" font-weight="600" class="fg">Budget Planner</text>
  <text x="252" y="114" font-size="13" class="mut">Interactive range slider</text>
  <text x="252" y="134" font-size="13" class="mut">and quick preset tags.</text>

  <rect x="462" y="14" width="206" height="152" rx="10" class="bd"/>
  <text x="482" y="48" font-size="13" font-weight="600" class="purp">WISHLIST</text>
  <text x="482" y="84" font-size="18" font-weight="600" class="fg">Saved Items</text>
  <text x="482" y="114" font-size="13" class="mut">Toggle saved products</text>
  <text x="482" y="134" font-size="13" class="mut">persisted in localStorage.</text>

  <rect x="692" y="14" width="206" height="152" rx="10" class="bd"/>
  <text x="712" y="48" font-size="13" font-weight="600" class="teal">RESILIENCE</text>
  <text x="712" y="84" font-size="18" font-weight="600" class="fg">Skeletons &amp; Fallbacks</text>
  <text x="712" y="114" font-size="13" class="mut">Shimmer loaders and clean</text>
  <text x="712" y="134" font-size="13" class="mut">image error states.</text>
</svg>
