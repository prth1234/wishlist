<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 202" width="900" height="202" role="img" aria-label="Wishlist features">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #F8FAFC; stroke-opacity: 0.22; stroke-width: 1.3; }
  .ind { fill: #818CF8; }
  .ind-s { stroke: #818CF8; }
  .purp { fill: #C084FC; }
  .purp-s { stroke: #C084FC; }
  .cobalt { fill: #60A5FA; }
  .cobalt-s { stroke: #60A5FA; }
  .teal { fill: #2DD4BF; }
  .teal-s { stroke: #2DD4BF; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .bd { stroke: #000000; stroke-opacity: 0.2; }
    .ind { fill: #4F46E5; }
    .ind-s { stroke: #4F46E5; }
    .purp { fill: #9333EA; }
    .purp-s { stroke: #9333EA; }
    .cobalt { fill: #0043ED; }
    .cobalt-s { stroke: #0043ED; }
    .teal { fill: #0D9488; }
    .teal-s { stroke: #0D9488; }
  }

  .card { animation: wl-ft-card 6s ease-in-out infinite; }
  @keyframes wl-ft-card {
    0%, 100% { stroke-opacity: 0.3; stroke-width: 1.3; }
    15% { stroke-opacity: 1; stroke-width: 2.2; }
    32% { stroke-opacity: 0.3; stroke-width: 1.3; }
  }

  .ic { stroke-dasharray: 64; stroke-dashoffset: 64; animation: wl-ft-ic 6s ease-in-out infinite; }
  @keyframes wl-ft-ic {
    0% { stroke-dashoffset: 64; }
    20%, 85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 64; }
  }

  .bar { stroke-dasharray: 166; stroke-dashoffset: 166; animation: wl-ft-bar 6s ease-in-out infinite; }
  @keyframes wl-ft-bar {
    0% { stroke-dashoffset: 166; }
    22%, 85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 166; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ic, .bar { stroke-dashoffset: 0 !important; }
  }
</style>

  <!-- Card 1: Filtering -->
  <rect x="2" y="14" width="206" height="172" rx="10" fill="none" class="cobalt-s card" style="animation-delay:0s"/>
  <path d="M172 34 H192 L184 44 V52 L180 50 V44 Z" fill="none" class="cobalt-s ic" stroke-width="1.6" stroke-linejoin="round" style="animation-delay:0s"/>
  <text x="22" y="48" font-size="13" font-weight="600" class="cobalt">FILTERING</text>
  <text x="22" y="84" font-size="18" font-weight="600" class="fg">Sidebar &amp; Tags</text>
  <text x="22" y="112" font-size="13" class="mut">Filter by category and</text>
  <text x="22" y="132" font-size="13" class="mut">price range in real time.</text>
  <line x1="22" y1="162" x2="188" y2="162" class="bd"/>
  <line x1="22" y1="162" x2="188" y2="162" class="cobalt-s bar" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0s"/>

  <!-- Card 2: Budget -->
  <rect x="232" y="14" width="206" height="172" rx="10" fill="none" class="ind-s card" style="animation-delay:1.5s"/>
  <path d="M402 42 H422 M412 34 V50" fill="none" class="ind-s ic" stroke-width="1.8" stroke-linecap="round" style="animation-delay:1.5s"/>
  <text x="252" y="48" font-size="13" font-weight="600" class="ind">BUDGET</text>
  <text x="252" y="84" font-size="18" font-weight="600" class="fg">Budget Planner</text>
  <text x="252" y="112" font-size="13" class="mut">Interactive range slider</text>
  <text x="252" y="132" font-size="13" class="mut">and quick preset tags.</text>
  <line x1="252" y1="162" x2="418" y2="162" class="bd"/>
  <line x1="252" y1="162" x2="418" y2="162" class="ind-s bar" stroke-width="2.2" stroke-linecap="round" style="animation-delay:1.5s"/>

  <!-- Card 3: Wishlist -->
  <rect x="462" y="14" width="206" height="172" rx="10" fill="none" class="purp-s card" style="animation-delay:3s"/>
  <path d="M642 36 C638 32 632 35 632 40 C632 46 642 52 642 52 C642 52 652 46 652 40 C652 35 646 32 642 36 Z" fill="none" class="purp-s ic" stroke-width="1.6" stroke-linejoin="round" style="animation-delay:3s"/>
  <text x="482" y="48" font-size="13" font-weight="600" class="purp">WISHLIST</text>
  <text x="482" y="84" font-size="18" font-weight="600" class="fg">Saved Items</text>
  <text x="482" y="112" font-size="13" class="mut">Toggle saved products</text>
  <text x="482" y="132" font-size="13" class="mut">persisted in localStorage.</text>
  <line x1="482" y1="162" x2="648" y2="162" class="bd"/>
  <line x1="482" y1="162" x2="648" y2="162" class="purp-s bar" stroke-width="2.2" stroke-linecap="round" style="animation-delay:3s"/>

  <!-- Card 4: Resilience -->
  <rect x="692" y="14" width="206" height="172" rx="10" fill="none" class="teal-s card" style="animation-delay:4.5s"/>
  <rect x="862" y="34" width="18" height="18" rx="4" fill="none" class="teal-s ic" stroke-width="1.6" style="animation-delay:4.5s"/>
  <text x="712" y="48" font-size="13" font-weight="600" class="teal">RESILIENCE</text>
  <text x="712" y="84" font-size="18" font-weight="600" class="fg">Skeletons &amp; Fallbacks</text>
  <text x="712" y="112" font-size="13" class="mut">Shimmer loaders and clean</text>
  <text x="712" y="132" font-size="13" class="mut">image error states.</text>
  <line x1="712" y1="162" x2="878" y2="162" class="bd"/>
  <line x1="712" y1="162" x2="878" y2="162" class="teal-s bar" stroke-width="2.2" stroke-linecap="round" style="animation-delay:4.5s"/>
</svg>
