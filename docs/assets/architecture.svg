<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 198" width="900" height="198" role="img" aria-label="Application flow">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #F8FAFC; stroke-opacity: 0.22; stroke-width: 1.3; }
  .ind { fill: #818CF8; }
  .ind-s { stroke: #818CF8; }
  .purp { fill: #C084FC; }
  .purp-s { stroke: #C084FC; }
  .cobalt { fill: #60A5FA; }
  .cobalt-s { stroke: #60A5FA; }
  .teal { fill: #2DD4BF; }
  .teal-s { stroke: #2DD4BF; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .bd { stroke: #000000; stroke-opacity: 0.2; }
    .ind { fill: #4F46E5; }
    .ind-s { stroke: #4F46E5; }
    .purp { fill: #9333EA; }
    .purp-s { stroke: #9333EA; }
    .cobalt { fill: #0043ED; }
    .cobalt-s { stroke: #0043ED; }
    .teal { fill: #0D9488; }
    .teal-s { stroke: #0D9488; }
  }

  .dash { stroke-dasharray: 5 6; animation: wl-fl 1.2s linear infinite; }
  @keyframes wl-fl { to { stroke-dashoffset: -11; } }

  /* 8s synchronized loop matching the 8s animateMotion dot */
  .n1 { animation: wl-n1 8s ease-in-out infinite; }
  @keyframes wl-n1 {
    0%, 22% { stroke-opacity: 1; stroke-width: 2.3; }
    28%, 100% { stroke-opacity: 0.28; stroke-width: 1.3; }
  }
  .n2 { animation: wl-n2 8s ease-in-out infinite; }
  @keyframes wl-n2 {
    0%, 22% { stroke-opacity: 0.28; stroke-width: 1.3; }
    25%, 47% { stroke-opacity: 1; stroke-width: 2.3; }
    53%, 100% { stroke-opacity: 0.28; stroke-width: 1.3; }
  }
  .n3 { animation: wl-n3 8s ease-in-out infinite; }
  @keyframes wl-n3 {
    0%, 47% { stroke-opacity: 0.28; stroke-width: 1.3; }
    50%, 72% { stroke-opacity: 1; stroke-width: 2.3; }
    78%, 100% { stroke-opacity: 0.28; stroke-width: 1.3; }
  }
  .n4 { animation: wl-n4 8s ease-in-out infinite; }
  @keyframes wl-n4 {
    0%, 72% { stroke-opacity: 0.28; stroke-width: 1.3; }
    75%, 97% { stroke-opacity: 1; stroke-width: 2.3; }
    100% { stroke-opacity: 0.28; stroke-width: 1.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <path id="wl-arch-track" d="M 101 174 L 797 174" fill="none" stroke="none"/>

  <rect x="4" y="20" width="194" height="128" rx="10" fill="none" class="ind-s n1"/>
  <text x="24" y="52" font-size="12.5" font-weight="600" class="mono ind">ROUTE /</text>
  <text x="24" y="86" font-size="18" font-weight="600" class="fg">Login View</text>
  <text x="24" y="114" font-size="13" class="mut">Simulated auth &amp; loader</text>

  <line class="dash ind-s" x1="204" y1="84" x2="230" y2="84" stroke-width="2" stroke-linecap="round"/>

  <rect x="236" y="20" width="194" height="128" rx="10" fill="none" class="cobalt-s n2"/>
  <text x="256" y="52" font-size="12.5" font-weight="600" class="mono cobalt">ROUTE /home</text>
  <text x="256" y="86" font-size="18" font-weight="600" class="fg">Product Grid</text>
  <text x="256" y="114" font-size="13" class="mut">Paginated 9-item batches</text>

  <line class="dash cobalt-s" x1="436" y1="84" x2="462" y2="84" stroke-width="2" stroke-linecap="round"/>

  <rect x="468" y="20" width="194" height="128" rx="10" fill="none" class="purp-s n3"/>
  <text x="488" y="52" font-size="12.5" font-weight="600" class="mono purp">STATE</text>
  <text x="488" y="86" font-size="18" font-weight="600" class="fg">Filter &amp; Budget</text>
  <text x="488" y="114" font-size="13" class="mut">Categories + price bands</text>

  <line class="dash purp-s" x1="668" y1="84" x2="694" y2="84" stroke-width="2" stroke-linecap="round"/>

  <rect x="700" y="20" width="194" height="128" rx="10" fill="none" class="teal-s n4"/>
  <text x="720" y="52" font-size="12.5" font-weight="600" class="mono teal">STORAGE</text>
  <text x="720" y="86" font-size="18" font-weight="600" class="fg">localStorage Sync</text>
  <text x="720" y="114" font-size="13" class="mut">Saved items &amp; filters</text>

  <!-- Synchronized signal bus -->
  <line x1="101" y1="174" x2="797" y2="174" class="bd" stroke-dasharray="3 6"/>
  <circle cx="101" cy="174" r="3" class="ind"/>
  <circle cx="333" cy="174" r="3" class="cobalt"/>
  <circle cx="565" cy="174" r="3" class="purp"/>
  <circle cx="797" cy="174" r="3" class="teal"/>
  <circle r="5" class="teal">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#wl-arch-track"/>
    </animateMotion>
  </circle>
</svg>
