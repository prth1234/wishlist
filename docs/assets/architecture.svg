<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-label="Application flow">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F8FAFC; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #F8FAFC; stroke-opacity: 0.22; stroke-width: 1.3; }
  .ind { fill: #818CF8; }
  .ind-s { stroke: #818CF8; }
  .purp { fill: #C084FC; }
  .purp-s { stroke: #C084FC; }
  .cobalt { fill: #60A5FA; }
  .cobalt-s { stroke: #60A5FA; }
  .teal { fill: #2DD4BF; }
  .teal-s { stroke: #2DD4BF; }
  .g1 { stop-color: #6366F1; }
  .g2 { stop-color: #A855F7; }
  .g3 { stop-color: #00CDAC; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #000000; }
    .mut { fill: #555555; }
    .bd { stroke: #000000; stroke-opacity: 0.2; }
    .ind { fill: #4F46E5; }
    .ind-s { stroke: #4F46E5; }
    .purp { fill: #9333EA; }
    .purp-s { stroke: #9333EA; }
    .cobalt { fill: #0043ED; }
    .cobalt-s { stroke: #0043ED; }
    .teal { fill: #0D9488; }
    .teal-s { stroke: #0D9488; }
  }
  
  .dash { stroke-dasharray: 5 6; animation: wl-fl 1.3s linear infinite; }
  @keyframes wl-fl { to { stroke-dashoffset: -11; } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <rect x="4" y="24" width="194" height="128" rx="10" class="bd"/>
  <text x="24" y="56" font-size="12.5" font-weight="600" class="mono ind">ROUTE /</text>
  <text x="24" y="90" font-size="18" font-weight="600" class="fg">Login View</text>
  <text x="24" y="118" font-size="13" class="mut">Simulated auth &amp; loader</text>

  <line class="dash ind-s" x1="204" y1="88" x2="230" y2="88" stroke-width="2" stroke-linecap="round"/>

  <rect x="236" y="24" width="194" height="128" rx="10" class="bd"/>
  <text x="256" y="56" font-size="12.5" font-weight="600" class="mono cobalt">ROUTE /home</text>
  <text x="256" y="90" font-size="18" font-weight="600" class="fg">Product Grid</text>
  <text x="256" y="118" font-size="13" class="mut">Paginated 9-item batches</text>

  <line class="dash cobalt-s" x1="436" y1="88" x2="462" y2="88" stroke-width="2" stroke-linecap="round"/>

  <rect x="468" y="24" width="194" height="128" rx="10" class="bd"/>
  <text x="488" y="56" font-size="12.5" font-weight="600" class="mono purp">STATE</text>
  <text x="488" y="90" font-size="18" font-weight="600" class="fg">Filter &amp; Budget</text>
  <text x="488" y="118" font-size="13" class="mut">Categories + price bands</text>

  <line class="dash purp-s" x1="668" y1="88" x2="694" y2="88" stroke-width="2" stroke-linecap="round"/>

  <rect x="700" y="24" width="194" height="128" rx="10" class="bd"/>
  <text x="720" y="56" font-size="12.5" font-weight="600" class="mono teal">STORAGE</text>
  <text x="720" y="90" font-size="18" font-weight="600" class="fg">localStorage Sync</text>
  <text x="720" y="118" font-size="13" class="mut">Saved items &amp; filters</text>
</svg>
